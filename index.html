<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflash — Tu plataforma, todos tus mundos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080b14;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #111827, #0f172a);
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    header h1 {
      font-size: 34px;
      color: #8b5cf6;
      margin-bottom: 8px;
    }

    header p {
      color: #aaa;
      font-size: 15px;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 35px auto;
    }

    .section-title {
      font-size: 25px;
      margin-bottom: 20px;
      color: #fff;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .service {
      background: #111827;
      border: 1px solid #252b3a;
      border-radius: 14px;
      padding: 20px;
      transition: 0.2s;
    }

    .service:hover {
      transform: translateY(-3px);
      border-color: #8b5cf6;
    }

    .service h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .price {
      color: #a78bfa;
      font-weight: bold;
      font-size: 17px;
    }

    .order-box {
      margin-top: 40px;
      background: #111827;
      border: 1px solid #252b3a;
      border-radius: 18px;
      padding: 25px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #1f2937;
      color: #aaa;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #8b5cf6;
      color: white;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #303746;
      background: #0b1020;
      color: white;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #8b5cf6;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .checkbox-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0b1020;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #252b3a;
    }

    .checkbox-item input {
      width: auto;
    }

    .total-box {
      margin: 25px 0;
      padding: 18px;
      background: #0b1020;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label {
      color: #aaa;
    }

    .total {
      font-size: 25px;
      font-weight: bold;
      color: #a78bfa;
    }

    #send-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #7c3aed, #8b5cf6);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #send-btn:hover {
      opacity: 0.9;
    }

    #send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #form-feedback {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #16251d;
      color: #86efac;
      text-align: center;
    }

    footer {
      margin-top: 50px;
      padding: 25px;
      text-align: center;
      color: #777;
      border-top: 1px solid #222;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>NETFLASH</h1>
    <p>Tu plataforma, todos tus mundos</p>
  </header>

  <main class="container">

    <h2 class="section-title">Nuestros servicios</h2>

    <div class="services" id="services-container"></div>

    <div class="order-box">

      <div class="tabs">
        <button class="tab active" id="tab-individual">Servicios individuales</button>
        <button class="tab" id="tab-combo">Combos</button>
      </div>

      <form id="order-form">

        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input
            type="text"
            id="nombre"
            name="Nombre"
            placeholder="Escribe tu nombre"
            required
          >
        </div>

        <div class="form-group">
          <label for="whatsapp">Número de WhatsApp</label>
          <input
            type="tel"
            id="whatsapp"
            name="WhatsApp"
            placeholder="Ej: 3001234567"
            required
          >
        </div>

        <!-- INDIVIDUALES -->
        <div id="individual-section">

          <div class="form-group">
            <label>Selecciona tus servicios</label>

            <div class="checkbox-list" id="individual-list"></div>
          </div>

        </div>

        <!-- COMBOS -->
        <div id="combo-section" class="hidden">

          <div class="form-group">
            <label for="combo-select">Selecciona un combo</label>

            <select id="combo-select" name="Combo">
              <option value="">Selecciona un combo</option>
            </select>
          </div>

        </div>

        <div class="form-group">
          <label for="pago">Método de pago</label>

          <select id="pago" name="Metodo de pago" required>
            <option value="">Selecciona un método</option>
            <option value="Nequi">Nequi</option>
            <option value="Daviplata">Daviplata</option>
            <option value="Transferencia bancaria">Transferencia bancaria</option>
          </select>
        </div>

        <div class="form-group">
          <label for="comprobante">Comprobante de pago</label>

          <input
            type="file"
            id="comprobante"
            name="Comprobante"
            accept="image/*,.pdf"
          >
        </div>

        <div class="form-group">
          <label for="comentario">Comentario</label>

          <textarea
            id="comentario"
            name="Comentario"
            placeholder="Escribe algún comentario si lo deseas..."
          ></textarea>
        </div>

        <div class="total-box">
          <span class="total-label">Total:</span>
          <span class="total" id="total-amount">$0</span>
        </div>

        <button type="submit" id="send-btn">
          Enviar pedido →
        </button>

        <p id="form-feedback"></p>

      </form>

    </div>

  </main>

  <footer>
    © 2026 Netflash — Todos los derechos reservados.
  </footer>


<script>

  /* ==============================
     CONFIGURACIÓN
  ============================== */

  const NETFLASH_NUMBER = "573107255126";

  const FORMSPREE_ENDPOINT =
    "https://formspree.io/f/mbgjvrga";


  /* ==============================
     SERVICIOS
  ============================== */

  const individuals = [
    {
      name: "Netflix",
      price: 15000
    },
    {
      name: "Disney+",
      price: 15000
    },
    {
      name: "Prime Video",
      price: 9000
    },
    {
      name: "Max",
      price: 9000
    },
    {
      name: "Canva",
      price: 12000
    },
    {
      name: "Crunchyroll",
      price: 9000
    },
    {
      name: "ViX",
      price: 9000
    },
    {
      name: "Apple TV+",
      price: 12000
    },
    {
      name: "IPTV Player Pro",
      price: 12000
    },
    {
      name: "Spotify",
      price: 14000
    },
    {
      name: "Plex",
      price: 10000
    },
    {
      name: "Paramount+",
      price: 12000
    }
  ];


  const combos = [
    {
      name: "Netflix + Disney+",
      price: 25000
    },
    {
      name: "Netflix + Prime Video",
      price: 22000
    },
    {
      name: "Netflix + Max",
      price: 22000
    },
    {
      name: "Netflix + Disney+ + Prime Video",
      price: 32000
    },
    {
      name: "Disney+ + Max",
      price: 22000
    }
  ];


  /* ==============================
     ELEMENTOS
  ============================== */

  const individualList =
    document.getElementById("individual-list");

  const comboSelect =
    document.getElementById("combo-select");

  const totalAmount =
    document.getElementById("total-amount");

  const individualSection =
    document.getElementById("individual-section");

  const comboSection =
    document.getElementById("combo-section");

  const tabIndividual =
    document.getElementById("tab-individual");

  const tabCombo =
    document.getElementById("tab-combo");

  const orderForm =
    document.getElementById("order-form");

  const sendBtn =
    document.getElementById("send-btn");

  const feedback =
    document.getElementById("form-feedback");


  let mode = "individual";


  /* ==============================
     MOSTRAR SERVICIOS
  ============================== */

  individuals.forEach(service => {

    const item = document.createElement("label");

    item.className = "checkbox-item";

    item.innerHTML = `
      <input
        type="checkbox"
        class="indiv-check"
        data-name="${service.name}"
        data-price="${service.price}"
      >

      <span>
        ${service.name}
        — $${service.price.toLocaleString("es-CO")}
      </span>
    `;

    individualList.appendChild(item);

  });


  /* ==============================
     MOSTRAR COMBOS
  ============================== */

  combos.forEach(combo => {

    const option = document.createElement("option");

    option.value = combo.name;

    option.textContent =
      `${combo.name} — $${combo.price.toLocaleString("es-CO")}`;

    option.dataset.price = combo.price;

    comboSelect.appendChild(option);

  });


  /* ==============================
     TOTAL INDIVIDUALES
  ============================== */

  function calculateIndividualTotal() {

    let total = 0;

    const checked =
      document.querySelectorAll(".indiv-check:checked");

    checked.forEach(item => {

      total += Number(item.dataset.price);

    });

    totalAmount.textContent =
      "$" + total.toLocaleString("es-CO");

  }


  /* ==============================
     TOTAL COMBO
  ============================== */

  function calculateComboTotal() {

    const selected =
      comboSelect.options[
        comboSelect.selectedIndex
      ];

    if (!selected || !selected.dataset.price) {

      totalAmount.textContent = "$0";

      return;
    }

    const price =
      Number(selected.dataset.price);

    totalAmount.textContent =
      "$" + price.toLocaleString("es-CO");

  }


  /* ==============================
     EVENTOS SERVICIOS
  ============================== */

  document
    .querySelectorAll(".indiv-check")
    .forEach(check => {

      check.addEventListener(
        "change",
        calculateIndividualTotal
      );

    });


  comboSelect.addEventListener(
    "change",
    calculateComboTotal
  );


  /* ==============================
     CAMBIAR A INDIVIDUALES
  ============================== */

  tabIndividual.addEventListener(
    "click",
    () => {

      mode = "individual";

      tabIndividual.classList.add("active");

      tabCombo.classList.remove("active");

      individualSection.classList.remove("hidden");

      comboSection.classList.add("hidden");

      calculateIndividualTotal();

    }
  );


  /* ==============================
     CAMBIAR A COMBOS
  ============================== */

  tabCombo.addEventListener(
    "click",
    () => {

      mode = "combo";

      tabCombo.classList.add("active");

      tabIndividual.classList.remove("active");

      comboSection.classList.remove("hidden");

      individualSection.classList.add("hidden");

      calculateComboTotal();

    }
  );


  /* ==============================
     ENVÍO DEL PEDIDO
  ============================== */

  orderForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const nombre =
        document
          .getElementById("nombre")
          .value
          .trim();


      const whatsapp =
        document
          .getElementById("whatsapp")
          .value
          .trim();


      const pago =
        document
          .getElementById("pago")
          .value;


      const comentario =
        document
          .getElementById("comentario")
          .value
          .trim();


      const comprobanteInput =
        document.getElementById("comprobante");


      const comprobanteFile =
        comprobanteInput.files[0];


      /* VALIDACIONES */

      if (!nombre) {

        alert(
          "Por favor escribe tu nombre."
        );

        return;
      }


      if (!whatsapp) {

        alert(
          "Por favor escribe tu número de WhatsApp."
        );

        return;
      }


      if (!pago) {

        alert(
          "Selecciona un método de pago."
        );

        return;
      }


      /* ==============================
         CONSTRUIR PEDIDO
      ============================== */

      let pedidoTexto = "";


      if (mode === "combo") {

        const selected =
          comboSelect.options[
            comboSelect.selectedIndex
          ];


        if (
          !selected ||
          !selected.value
        ) {

          alert(
            "Selecciona un combo."
          );

          return;
        }


        pedidoTexto =
          `Combo: ${selected.value}`;

      }

      else {

        const checked =
          Array.from(
            document.querySelectorAll(
              ".indiv-check:checked"
            )
          );


        if (checked.length === 0) {

          alert(
            "Selecciona al menos un servicio."
          );

          return;
        }


        pedidoTexto =
          checked
            .map(
              item => item.dataset.name
            )
            .join(", ");

      }


      /* ==============================
         TOTAL
      ============================== */

      const total =
        totalAmount.textContent;


      /* ==============================
         FORMSPREE
      ============================== */

      const data =
        new FormData();


      data.append(
        "Nombre",
        nombre
      );


      data.append(
        "WhatsApp",
        whatsapp
      );


      data.append(
        "Pedido",
        pedidoTexto
      );


      data.append(
        "Total",
        total
      );


      data.append(
        "Metodo de pago",
        pago
      );


      data.append(
        "Comentario",
        comentario || "—"
      );


      if (comprobanteFile) {

        data.append(
          "Comprobante",
          comprobanteFile
        );

      }


      /* ==============================
         BOTÓN
      ============================== */

      sendBtn.disabled = true;

      sendBtn.textContent =
        "Enviando...";


      feedback.style.display =
        "none";


      try {

        const resp =
          await fetch(
            FORMSPREE_ENDPOINT,
            {
              method: "POST",

              body: data,

              headers: {
                "Accept":
                  "application/json"
              }
            }
          );


        /* ==============================
           LEER RESPUESTA REAL
        ============================== */

        const resultado =
          await resp.text();


        console.log(
          "Respuesta de Formspree:",
          resp.status,
          resultado
        );


        /* ==============================
           SI SALIÓ BIEN
        ============================== */

        if (resp.ok) {

          feedback.textContent =
            "¡Listo! Recibimos tu pedido. Te contactaremos pronto por WhatsApp.";

          feedback.style.display =
            "block";

          feedback.style.color =
            "#86efac";


          sendBtn.textContent =
            "Pedido enviado ✓";


          /*
            Desactivar formulario
          */

          orderForm
            .querySelectorAll(
              "input, select, textarea"
            )
            .forEach(
              element => {
                element.disabled = true;
              }
            );


          sendBtn.disabled = true;

        }


        /* ==============================
           SI FORMSPREE DA ERROR
        ============================== */

        else {

          console.error(
            "Formspree rechazó el pedido:",
            resultado
          );


          throw new Error(
            resultado ||
            "Formspree devolvió un error."
          );

        }

      }


      /* ==============================
         ERROR
      ============================== */

      catch (error) {

        console.error(
          "Error enviando el formulario:",
          error
        );


        feedback.textContent =
          "Hubo un problema enviando el pedido. Revisa la consola para ver el error.";

        feedback.style.display =
          "block";

        feedback.style.color =
          "#f87171";


        sendBtn.disabled =
          false;

        sendBtn.textContent =
          "Enviar pedido →";

      }

    }
  );

</script>

</body>
</html>
